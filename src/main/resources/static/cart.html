<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 - RDB Shop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
    <h1 class="page-title">장바구니</h1>
    <div id="alert"></div>
    <div class="card">
        <div id="cartContent"><div class="loading">불러오는 중...</div></div>
    </div>
</div>

<!-- 주문하기 모달 (쿠폰 선택) -->
<div class="modal-overlay" id="orderModal">
    <div class="modal" style="max-width:500px; width:90%;">
        <div class="modal-title">주문하기</div>
        <div style="margin-bottom:1rem;">
            <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.9rem;">
                <span style="color:#64748b;">상품 합계</span>
                <span id="modalTotalPrice" style="font-weight:600;"></span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.9rem;" id="discountRow" style="display:none;">
                <span style="color:#64748b;">쿠폰 할인</span>
                <span id="modalDiscountPrice" style="font-weight:600; color:#ef4444;"></span>
            </div>
            <div style="display:flex; justify-content:space-between; padding-top:0.75rem; border-top:1px solid #e2e8f0; font-size:1rem;">
                <span style="font-weight:700;">최종 결제금액</span>
                <span id="modalFinalPrice" style="font-weight:700; color:#3b82f6; font-size:1.1rem;"></span>
            </div>
        </div>
        <div>
            <h3 style="font-size:0.875rem; font-weight:600; margin-bottom:0.75rem; color:#374151;">쿠폰 선택 (선택사항)</h3>
            <div id="couponSelectArea">
                <div class="loading" style="padding:0.5rem 0; font-size:0.85rem;">쿠폰 목록 불러오는 중...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" onclick="closeOrderModal()">취소</button>
            <button class="btn btn-primary" type="button" onclick="confirmOrder()" id="confirmOrderBtn">결제하기</button>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    const member = requireAuth();
    renderNavbar('cart');

    let cartId = null;
    let cartTotal = 0;         // 장바구니 합계
    let selectedCouponId = null;  // 선택된 memberCouponId

    async function loadCart() {
        const res = await api(`/carts`);
        if (!res || !res.ok) return;

        const cart = await res.json();
        cartId = cart.cartId;
        renderCart(cart.cartItems);
    }

    function renderCart(items) {
        const el = document.getElementById('cartContent');
        if (!items || items.length === 0) {
            el.innerHTML = '<div class="empty"><p>장바구니가 비어있습니다.</p></div>';
            return;
        }

        const total = items.reduce((sum, i) => sum + i.price * i.quantity, 0);
        cartTotal = total;

        el.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>상품명</th>
                            <th>단가</th>
                            <th>수량</th>
                            <th>소계</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(item => `
                            <tr>
                                <td>${item.productName}</td>
                                <td>${formatPrice(item.price)}</td>
                                <td>
                                    <div style="display:flex; gap:0.5rem; align-items:center;">
                                        <input class="form-control" type="number"
                                            id="qty-${item.cartItemId}"
                                            value="${item.quantity}" min="1" max="999"
                                            style="width:70px;">
                                        <button class="btn btn-secondary btn-sm"
                                            onclick="updateQty(${item.cartItemId})">변경</button>
                                    </div>
                                </td>
                                <td>${formatPrice(item.price * item.quantity)}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm"
                                        onclick="deleteItem(${item.cartItemId})">삭제</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            <div class="cart-total">
                <span>합계</span>
                <span>${formatPrice(total)}</span>
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:1rem; gap:0.75rem;">
                <button class="btn btn-secondary" onclick="clearCart()">전체 삭제</button>
                <button class="btn btn-primary" onclick="placeOrder()">주문하기</button>
            </div>
        `;
    }

    async function updateQty(cartItemId) {
        const qty = parseInt(document.getElementById(`qty-${cartItemId}`).value);
        if (qty < 1) { alert('수량은 1 이상이어야 합니다.'); return; }

        const res = await api(`/cart-items/${cartItemId}`, {
            method: 'PATCH',
            json: { quantity: qty },
        });
        if (res && res.ok) {
            showAlert('수량이 변경됐습니다.', 'success');
            loadCart();
        } else {
            const data = await res?.json().catch(() => ({}));
            showAlert(data?.message || '변경에 실패했습니다.', 'danger');
        }
    }

    async function deleteItem(cartItemId) {
        if (!confirm('삭제하시겠습니까?')) return;
        const res = await api(`/cart-items/${cartItemId}`, { method: 'DELETE' });
        if (res && res.ok) loadCart();
    }

    async function clearCart() {
        if (!confirm('장바구니를 전체 비우시겠습니까?')) return;
        const res = await api(`/cart-items?cartId=${cartId}`, { method: 'DELETE' });
        if (res && res.ok) loadCart();
    }

    // 주문하기 버튼 클릭 → 쿠폰 선택 모달 오픈
    async function placeOrder() {
        selectedCouponId = null;
        document.getElementById('modalTotalPrice').textContent = formatPrice(cartTotal);
        document.getElementById('modalDiscountPrice').textContent = '';
        document.getElementById('modalFinalPrice').textContent = formatPrice(cartTotal);
        document.getElementById('discountRow').style.display = 'none';
        document.getElementById('orderModal').classList.add('open');

        // 사용 가능한 쿠폰 목록 로드
        const res = await api('/coupons/me');
        const area = document.getElementById('couponSelectArea');

        if (!res || !res.ok) {
            area.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8;">쿠폰을 불러올 수 없습니다.</div>';
            return;
        }

        const coupons = await res.json();
        // 사용 가능한 쿠폰만 필터 (미사용 + 미만료 + 최소 주문 금액 충족)
        const available = coupons.filter(c => !c.used && !c.expired && cartTotal >= c.minOrderAmount);

        if (available.length === 0) {
            area.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8; padding:0.5rem 0;">사용 가능한 쿠폰이 없습니다.</div>';
            return;
        }

        area.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:0.5rem; max-height:200px; overflow-y:auto;">
                <label style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem; border:2px solid #e2e8f0; border-radius:8px; cursor:pointer;" id="coupon-none">
                    <input type="radio" name="coupon" value="" checked onchange="onCouponSelect(null, 0)">
                    <span style="font-size:0.875rem; color:#64748b;">쿠폰 사용 안 함</span>
                </label>
                ${available.map(c => {
                    // 할인 금액 미리 계산
                    let discount = Math.floor(cartTotal * c.discountRate / 100);
                    if (c.maxDiscountAmount != null) discount = Math.min(discount, c.maxDiscountAmount);
                    return `
                        <label style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem; border:2px solid #e2e8f0; border-radius:8px; cursor:pointer;" id="coupon-${c.memberCouponId}">
                            <input type="radio" name="coupon" value="${c.memberCouponId}" onchange="onCouponSelect(${c.memberCouponId}, ${discount})">
                            <div>
                                <div style="font-weight:600; font-size:0.875rem;">${c.couponName}</div>
                                <div style="font-size:0.8rem; color:#3b82f6;">${c.discountRate}% 할인 → <strong>-${discount.toLocaleString()}원</strong></div>
                                ${c.maxDiscountAmount != null ? `<div style="font-size:0.75rem; color:#94a3b8;">최대 ${c.maxDiscountAmount.toLocaleString()}원 할인</div>` : ''}
                            </div>
                        </label>
                    `;
                }).join('')}
            </div>
        `;
    }

    function onCouponSelect(memberCouponId, discountAmount) {
        selectedCouponId = memberCouponId;
        const finalPrice = cartTotal - discountAmount;

        document.getElementById('modalFinalPrice').textContent = formatPrice(finalPrice);

        if (discountAmount > 0) {
            document.getElementById('discountRow').style.display = 'flex';
            document.getElementById('modalDiscountPrice').textContent = `-${formatPrice(discountAmount)}`;
        } else {
            document.getElementById('discountRow').style.display = 'none';
        }

        // 선택된 라디오 라벨 하이라이트
        document.querySelectorAll('[id^="coupon-"]').forEach(el => {
            el.style.borderColor = '#e2e8f0';
        });
        const targetId = memberCouponId ? `coupon-${memberCouponId}` : 'coupon-none';
        const target = document.getElementById(targetId);
        if (target) target.style.borderColor = '#3b82f6';
    }

    function closeOrderModal() {
        document.getElementById('orderModal').classList.remove('open');
    }

    document.getElementById('orderModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeOrderModal();
    });

    async function confirmOrder() {
        const btn = document.getElementById('confirmOrderBtn');
        btn.disabled = true;
        btn.textContent = '처리 중...';

        const res = await api('/orders', {
            method: 'POST',
            json: { memberCouponId: selectedCouponId || null },
        });

        btn.disabled = false;
        btn.textContent = '결제하기';

        if (res && res.status === 201) {
            closeOrderModal();
            showAlert('주문이 완료됐습니다!', 'success');
            setTimeout(() => location.href = '/orders.html', 1500);
        } else {
            const data = await res?.json().catch(() => ({}));
            showAlert(data?.message || '주문에 실패했습니다.', 'danger');
            closeOrderModal();
        }
    }

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        setTimeout(() => el.innerHTML = '', 3000);
    }

    loadCart();
</script>
</body>
</html>
