<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDB Shop</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
    <h1 class="page-title">전체 상품</h1>
    <div id="alert"></div>
    <div id="productGrid" class="product-grid">
        <div class="loading">상품을 불러오는 중...</div>
    </div>
</div>

<!-- 리뷰 모달 -->
<div class="modal-overlay" id="reviewModal">
    <div class="modal" style="max-width:620px; width:90%;">
        <div class="modal-title" id="reviewModalTitle">리뷰</div>

        <div id="reviewList" style="max-height:360px; overflow-y:auto; margin-bottom:1rem;"></div>

        <div id="reviewFormWrap" style="display:none;">
            <hr style="margin:1rem 0; border-color:#e2e8f0;">
            <h3 style="font-size:0.9rem; font-weight:600; margin-bottom:0.75rem;">리뷰 작성</h3>
            <form id="reviewForm">
                <input type="hidden" id="reviewProductId">
                <div class="form-group">
                    <label>별점</label>
                    <div id="starInput" style="display:flex; gap:0.25rem; font-size:1.5rem; cursor:pointer;">
                        <span data-star="1">☆</span>
                        <span data-star="2">☆</span>
                        <span data-star="3">☆</span>
                        <span data-star="4">☆</span>
                        <span data-star="5">☆</span>
                    </div>
                    <input type="hidden" id="reviewRating" value="0">
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <textarea class="form-control" id="reviewContent" rows="3" placeholder="구매하신 상품에 대한 솔직한 후기를 남겨주세요." required></textarea>
                </div>
                <button class="btn btn-primary btn-sm" type="submit">등록</button>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" onclick="closeReviewModal()">닫기</button>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    renderNavbar('home');
    const member = Session.get();

    // 찜한 상품 ID 목록 (Set으로 빠른 조회)
    let wishedProductIds = new Set();

    async function loadWishList() {
        if (!member) return;
        const res = await api('/wish-items/me');
        if (!res || !res.ok) return;
        const items = await res.json();
        wishedProductIds = new Set(items.map(w => w.productId));
    }

    async function loadProducts() {
        await loadWishList();

        const res = await fetch('/products', { credentials: 'same-origin' });
        if (!res.ok) {
            document.getElementById('productGrid').innerHTML = '<div class="empty"><p>상품을 불러올 수 없습니다.</p></div>';
            return;
        }

        const products = await res.json();
        const grid = document.getElementById('productGrid');

        if (products.length === 0) {
            grid.innerHTML = '<div class="empty"><p>등록된 상품이 없습니다.</p></div>';
            return;
        }

        grid.innerHTML = products.map(p => `
            <div class="product-card" id="card-${p.productId}">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div class="product-name">${p.name}</div>
                    ${member ? `
                        <button onclick="toggleWish(${p.productId})" id="wish-${p.productId}"
                            style="background:none; border:none; font-size:1.4rem; cursor:pointer; line-height:1; padding:0;"
                            title="찜하기">
                            ${wishedProductIds.has(p.productId) ? '♥' : '♡'}
                        </button>
                    ` : ''}
                </div>
                <div class="product-price">${formatPrice(p.price)}</div>
                <div class="product-desc">${p.description || ''}</div>
                ${member ? `
                    <div class="product-qty">
                        <input class="form-control" type="number" id="qty-${p.productId}" value="1" min="1" max="999">
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="addToCart(${p.productId})">장바구니 담기</button>
                ` : `
                    <a href="/login.html" class="btn btn-secondary btn-sm">로그인 후 구매</a>
                `}
                <button class="btn btn-secondary btn-sm" style="margin-top:0.5rem;" onclick="openReviewModal(${p.productId}, '${p.name}')">리뷰 보기</button>
            </div>
        `).join('');
    }

    async function toggleWish(productId) {
        const btn = document.getElementById(`wish-${productId}`);
        const isWished = wishedProductIds.has(productId);

        if (isWished) {
            const res = await api(`/wish-items/${productId}`, { method: 'DELETE' });
            if (res && res.ok) {
                wishedProductIds.delete(productId);
                btn.textContent = '♡';
            }
        } else {
            const res = await api(`/wish-items/${productId}`, { method: 'POST' });
            if (res && res.status === 201) {
                wishedProductIds.add(productId);
                btn.textContent = '♥';
            }
        }
    }

    async function addToCart(productId) {
        if (!member) { location.href = '/login.html'; return; }

        const qty = parseInt(document.getElementById(`qty-${productId}`).value);
        if (qty < 1) { alert('수량을 1 이상 입력해주세요.'); return; }

        const res = await fetch('/cart-items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId, quantity: qty }),
            credentials: 'same-origin',
        });

        const alertEl = document.getElementById('alert');
        if (res.status === 201) {
            alertEl.innerHTML = `<div class="alert alert-success">장바구니에 담겼습니다! <a href="/cart.html">장바구니 보기</a></div>`;
            setTimeout(() => alertEl.innerHTML = '', 3000);
        } else {
            const data = await res.json().catch(() => ({}));
            alertEl.innerHTML = `<div class="alert alert-danger">${data.message || '담기에 실패했습니다.'}</div>`;
        }
    }

    // ── 리뷰 모달 ────────────────────────────────────────────────
    let currentProductId = null;

    async function openReviewModal(productId, productName) {
        currentProductId = productId;
        document.getElementById('reviewModalTitle').textContent = `${productName} - 리뷰`;
        document.getElementById('reviewList').innerHTML = '<div class="loading">불러오는 중...</div>';
        document.getElementById('reviewFormWrap').style.display = 'none';
        document.getElementById('reviewModal').classList.add('open');

        await loadReviewList(productId);

        if (member) {
            await checkAndShowReviewForm(productId);
        }
    }

    async function loadReviewList(productId) {
        const res = await fetch(`/reviews?productId=${productId}`, { credentials: 'same-origin' });
        const reviewList = document.getElementById('reviewList');

        if (!res.ok) {
            reviewList.innerHTML = '<div class="empty">리뷰를 불러올 수 없습니다.</div>';
            return;
        }

        const reviews = await res.json();
        if (reviews.length === 0) {
            reviewList.innerHTML = '<div class="empty" style="padding:1rem 0; color:#94a3b8;">아직 리뷰가 없습니다.</div>';
            return;
        }

        reviewList.innerHTML = reviews.map(r => `
            <div style="padding:0.75rem 0; border-bottom:1px solid #e2e8f0;">
                <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">
                    <span style="color:#f59e0b;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                    <span style="font-size:0.75rem; color:#94a3b8;">${formatDate(r.createdAt)}</span>
                    ${r.updated ? '<span style="font-size:0.7rem; color:#94a3b8;">(수정됨)</span>' : ''}
                </div>
                <div style="font-size:0.9rem; color:#334155;">${r.content}</div>
            </div>
        `).join('');
    }

    async function checkAndShowReviewForm(productId) {
        const myReviewsRes = await api('/reviews/me');
        if (!myReviewsRes || !myReviewsRes.ok) return;

        const myReviews = await myReviewsRes.json();
        const alreadyReviewed = myReviews.some(r => r.productId === productId);
        if (alreadyReviewed) return;

        document.getElementById('reviewProductId').value = productId;
        document.getElementById('reviewFormWrap').style.display = 'block';
        resetStars();
        document.getElementById('reviewContent').value = '';
    }

    function closeReviewModal() {
        document.getElementById('reviewModal').classList.remove('open');
        currentProductId = null;
    }

    document.getElementById('reviewModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeReviewModal();
    });

    function resetStars(selected = 0) {
        document.getElementById('reviewRating').value = selected;
        document.querySelectorAll('#starInput span').forEach((el, idx) => {
            el.textContent = idx < selected ? '★' : '☆';
        });
    }

    document.querySelectorAll('#starInput span').forEach(el => {
        el.addEventListener('click', () => resetStars(parseInt(el.dataset.star)));
        el.addEventListener('mouseover', () => {
            const val = parseInt(el.dataset.star);
            document.querySelectorAll('#starInput span').forEach((s, idx) => {
                s.textContent = idx < val ? '★' : '☆';
            });
        });
        el.addEventListener('mouseout', () => {
            const current = parseInt(document.getElementById('reviewRating').value);
            document.querySelectorAll('#starInput span').forEach((s, idx) => {
                s.textContent = idx < current ? '★' : '☆';
            });
        });
    });

    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const rating = parseInt(document.getElementById('reviewRating').value);
        if (rating === 0) { alert('별점을 선택해주세요.'); return; }

        const res = await api('/reviews', {
            method: 'POST',
            json: {
                productId: parseInt(document.getElementById('reviewProductId').value),
                rating,
                content: document.getElementById('reviewContent').value,
            },
        });

        if (res && res.status === 201) {
            document.getElementById('reviewFormWrap').style.display = 'none';
            await loadReviewList(currentProductId);
        } else {
            const data = await res?.json().catch(() => ({}));
            alert(data?.message || '리뷰 등록에 실패했습니다.');
        }
    });

    loadProducts();
</script>
</body>
</html>
