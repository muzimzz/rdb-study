<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠폰 관리 - 관리자</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
    <div class="section-header">
        <h1 class="page-title" style="margin-bottom:0;">쿠폰 관리</h1>
        <div style="display:flex; gap:0.5rem;">
            <a href="/admin/products.html" class="btn btn-secondary btn-sm">상품 관리</a>
            <a href="/admin/members.html" class="btn btn-secondary btn-sm">회원 관리</a>
            <a href="/admin/reviews.html" class="btn btn-secondary btn-sm">리뷰 관리</a>
        </div>
    </div>
    <div id="alert"></div>

    <!-- 쿠폰 생성 폼 -->
    <div class="card" style="margin-bottom:1.5rem;">
        <h2 style="font-size:1rem; font-weight:600; margin-bottom:1rem;">새 쿠폰 생성</h2>
        <form id="createForm">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                <div class="form-group">
                    <label>쿠폰 이름 <span style="color:#ef4444;">*</span></label>
                    <input class="form-control" type="text" id="c-name" placeholder="신규 가입 10% 할인" required>
                </div>
                <div class="form-group">
                    <label>쿠폰 코드
                        <span style="font-size:0.75rem; color:#94a3b8;">(비워두면 관리자 직접 발급 전용)</span>
                    </label>
                    <input class="form-control" type="text" id="c-code" placeholder="WELCOME10">
                </div>
                <div class="form-group">
                    <label>할인율 (%) <span style="color:#ef4444;">*</span></label>
                    <input class="form-control" type="number" id="c-rate" min="1" max="100" placeholder="10" required>
                </div>
                <div class="form-group">
                    <label>최소 주문 금액
                        <span style="font-size:0.75rem; color:#94a3b8;">(0 = 제한 없음)</span>
                    </label>
                    <input class="form-control" type="number" id="c-min" min="0" value="0">
                </div>
                <div class="form-group">
                    <label>최대 할인 금액
                        <span style="font-size:0.75rem; color:#94a3b8;">(비워두면 제한 없음)</span>
                    </label>
                    <input class="form-control" type="number" id="c-max" min="0" placeholder="5000">
                </div>
                <div class="form-group">
                    <label>발급 수량 한도
                        <span style="font-size:0.75rem; color:#94a3b8;">(비워두면 무제한)</span>
                    </label>
                    <input class="form-control" type="number" id="c-limit" min="1" placeholder="100">
                </div>
                <div class="form-group">
                    <label>만료일시 <span style="color:#ef4444;">*</span></label>
                    <input class="form-control" type="datetime-local" id="c-expired" required>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">쿠폰 생성</button>
        </form>
    </div>

    <!-- 쿠폰 목록 -->
    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>쿠폰명</th>
                        <th>코드</th>
                        <th>할인율</th>
                        <th>최소주문</th>
                        <th>최대할인</th>
                        <th>발급현황</th>
                        <th>만료일</th>
                        <th>발급</th>
                    </tr>
                </thead>
                <tbody id="couponTable">
                    <tr><td colspan="9" class="loading">불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 특정 회원에게 발급 모달 -->
<div class="modal-overlay" id="issueModal">
    <div class="modal" style="max-width:420px; width:90%;">
        <div class="modal-title">회원에게 쿠폰 발급</div>
        <form id="issueForm">
            <input type="hidden" id="issueCouponId">
            <div style="margin-bottom:1rem; padding:0.75rem; background:#f8fafc; border-radius:8px; font-size:0.875rem;">
                <span style="color:#64748b;">쿠폰: </span>
                <span id="issueCouponName" style="font-weight:600;"></span>
            </div>
            <div class="form-group">
                <label>회원 ID <span style="color:#ef4444;">*</span></label>
                <input class="form-control" type="number" id="issueMemberId" min="1" placeholder="발급할 회원의 ID를 입력하세요" required>
                <p style="font-size:0.75rem; color:#94a3b8; margin-top:0.375rem;">회원 관리 페이지에서 회원 ID를 확인할 수 있습니다.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="closeIssueModal()">취소</button>
                <button class="btn btn-primary" type="submit">발급</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    const member = requireAdmin();
    renderNavbar('admin');

    async function loadCoupons() {
        const res = await api('/admin/coupons');
        if (!res || !res.ok) return;

        const coupons = await res.json();
        const tbody = document.getElementById('couponTable');

        if (coupons.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty">등록된 쿠폰이 없습니다.</td></tr>';
            return;
        }

        const now = new Date();
        tbody.innerHTML = coupons.map(c => {
            // 만료 여부 계산
            const expiredDate = Array.isArray(c.expiredAt)
                ? new Date(c.expiredAt[0], c.expiredAt[1]-1, c.expiredAt[2], c.expiredAt[3]||0, c.expiredAt[4]||0)
                : new Date(c.expiredAt);
            const isExpired = expiredDate < now;

            // 수량 소진 여부
            const isSoldOut = c.maxIssueCount != null && c.issuedCount >= c.maxIssueCount;

            let statusBadge = '';
            if (isExpired) statusBadge = '<span class="badge badge-danger" style="margin-left:0.375rem;">만료</span>';
            else if (isSoldOut) statusBadge = '<span class="badge badge-warning" style="margin-left:0.375rem;">소진</span>';

            return `
                <tr>
                    <td>${c.couponId}</td>
                    <td style="font-weight:500;">${c.name}${statusBadge}</td>
                    <td>${c.code ? `<code style="background:#f1f5f9; padding:0.2rem 0.4rem; border-radius:4px; font-size:0.8rem;">${c.code}</code>` : '<span style="color:#94a3b8;">-</span>'}</td>
                    <td><span style="font-weight:700; color:#3b82f6;">${c.discountRate}%</span></td>
                    <td>${c.minOrderAmount > 0 ? formatPrice(c.minOrderAmount) + ' 이상' : '<span style="color:#94a3b8;">제한없음</span>'}</td>
                    <td>${c.maxDiscountAmount != null ? formatPrice(c.maxDiscountAmount) : '<span style="color:#94a3b8;">제한없음</span>'}</td>
                    <td>
                        <span style="font-weight:600;">${c.issuedCount}</span>
                        <span style="color:#94a3b8;"> / ${c.maxIssueCount != null ? c.maxIssueCount : '∞'}</span>
                    </td>
                    <td style="font-size:0.82rem; ${isExpired ? 'color:#94a3b8;' : ''}">${formatDate(c.expiredAt)}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick='openIssueModal(${c.couponId}, "${c.name}")'
                            ${isExpired || isSoldOut ? 'disabled title="발급 불가"' : ''}>
                            발급
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // 쿠폰 생성
    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const maxDiscountVal = document.getElementById('c-max').value;
        const maxLimitVal = document.getElementById('c-limit').value;
        const codeVal = document.getElementById('c-code').value.trim();

        // datetime-local → ISO → LocalDateTime 형식으로 변환
        const expiredRaw = document.getElementById('c-expired').value;  // "2025-12-31T23:59"
        const expiredAt = expiredRaw ? expiredRaw + ':00' : null;       // 초 추가

        const res = await api('/admin/coupons', {
            method: 'POST',
            json: {
                name: document.getElementById('c-name').value,
                code: codeVal || null,
                discountRate: parseInt(document.getElementById('c-rate').value),
                minOrderAmount: parseInt(document.getElementById('c-min').value) || 0,
                maxDiscountAmount: maxDiscountVal ? parseInt(maxDiscountVal) : null,
                maxIssueCount: maxLimitVal ? parseInt(maxLimitVal) : null,
                expiredAt,
            },
        });

        if (res && res.status === 201) {
            showAlert('쿠폰이 생성됐습니다.', 'success');
            document.getElementById('createForm').reset();
            loadCoupons();
        } else {
            const data = await res?.json().catch(() => ({}));
            showAlert(data?.message || '생성에 실패했습니다.', 'danger');
        }
    });

    // 발급 모달
    function openIssueModal(couponId, couponName) {
        document.getElementById('issueCouponId').value = couponId;
        document.getElementById('issueCouponName').textContent = couponName;
        document.getElementById('issueMemberId').value = '';
        document.getElementById('issueModal').classList.add('open');
    }

    function closeIssueModal() {
        document.getElementById('issueModal').classList.remove('open');
    }

    document.getElementById('issueModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeIssueModal();
    });

    document.getElementById('issueForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const couponId = document.getElementById('issueCouponId').value;
        const memberId = parseInt(document.getElementById('issueMemberId').value);

        const res = await api(`/admin/coupons/${couponId}/issue`, {
            method: 'POST',
            json: { memberId },
        });

        if (res && res.ok) {
            closeIssueModal();
            showAlert('쿠폰이 발급됐습니다.', 'success');
            loadCoupons();
        } else {
            const data = await res?.json().catch(() => ({}));
            showAlert(data?.message || '발급에 실패했습니다.', 'danger');
        }
    });

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        setTimeout(() => el.innerHTML = '', 3000);
    }

    loadCoupons();
</script>
</body>
</html>
